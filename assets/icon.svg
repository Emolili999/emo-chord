<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c162d"/>
      <stop offset="50%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- Outer Rim Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Ambient Cyan Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#1d4ed8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Piano Bed Glow -->
    <radialGradient id="pianoGlow" cx="50%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- EC Gradient -->
    <linearGradient id="ecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- White Keys Gradient -->
    <linearGradient id="whiteKeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Active Key Gradient 1 (Cyan - E Key) -->
    <linearGradient id="activeCyanKey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Active Key Gradient 2 (Blue - C Key) -->
    <linearGradient id="activeBlueKey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Black Key Gradient -->
    <linearGradient id="blackKeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="keyBottomShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Piano Bed Chassis -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>
  <rect x="22" y="22" width="468" height="468" rx="106" ry="106" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.65"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="256" cy="205" r="160" fill="url(#centerGlow)"/>
  <ellipse cx="256" cy="380" rx="170" ry="70" fill="url(#pianoGlow)"/>

  <!-- Floating Falling Notes / Particles -->
  <g opacity="0.3">
    <!-- Star particles -->
    <circle cx="95" cy="130" r="3" fill="#38bdf8"/>
    <circle cx="415" cy="140" r="2.5" fill="#60a5fa"/>
    <circle cx="405" cy="280" r="3" fill="#38bdf8"/>
    <circle cx="105" cy="290" r="2.5" fill="#93c5fd"/>

    <!-- Falling note lines hitting the keys -->
    <line x1="178" y1="312" x2="178" y2="336" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="308" y1="316" x2="308" y2="336" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- ==================== EC MONOGRAM ==================== -->
  <!-- Neon Under-glow -->
  <g filter="url(#neonFilter)" opacity="0.75">
    <!-- E -->
    <path d="M 220 128 L 146 128 C 136 128 130 135 130 145 L 130 259 C 130 269 136 276 146 276 L 220 276" 
          fill="none" stroke="#0284c7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="134" y1="202" x2="204" y2="202" stroke="#0284c7" stroke-width="24" stroke-linecap="round"/>

    <!-- C -->
    <path d="M 376 144 C 348 122 306 120 280 146 C 263 162 254 182 254 202 C 254 222 263 242 280 258 C 306 284 348 282 376 260" 
          fill="none" stroke="#0284c7" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- Crisp Core Layer -->
  <g>
    <!-- E -->
    <path d="M 220 128 L 146 128 C 136 128 130 135 130 145 L 130 259 C 130 269 136 276 146 276 L 220 276" 
          fill="none" stroke="url(#ecGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="134" y1="202" x2="204" y2="202" stroke="url(#ecGrad)" stroke-width="24" stroke-linecap="round"/>

    <!-- C -->
    <path d="M 376 144 C 348 122 306 120 280 146 C 263 162 254 182 254 202 C 254 222 263 242 280 258 C 306 284 348 282 376 260" 
          fill="none" stroke="url(#ecGrad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Specular Gloss Highlights -->
    <path d="M 146 125 L 210 125" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="140" y1="199" x2="194" y2="199" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 302 122 C 328 122 355 130 368 140" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- ==================== PIANO KEYBOARD ==================== -->
  <g id="piano">
    <!-- Chassis Shadow -->
    <rect x="110" y="333" width="292" height="85" rx="14" fill="#000000" opacity="0.55"/>

    <!-- Chassis Body -->
    <rect x="112" y="332" width="288" height="84" rx="12" fill="url(#chassisGrad)" stroke="#1e293b" stroke-width="2"/>
    <rect x="114" y="334" width="284" height="80" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.45"/>

    <!-- Cyan Felt Cushion Line -->
    <rect x="122" y="338" width="268" height="4" rx="1" fill="#0284c7" opacity="0.8"/>

    <!-- White Keys -->
    <rect x="126" y="342" width="24" height="66" rx="3.5" ry="3.5" fill="url(#whiteKeyGrad)" stroke="#94a3b8" stroke-width="0.75"/><rect x="126" y="403" width="24" height="5" rx="2" fill="url(#keyBottomShadow)" opacity="0.45"/><rect x="152" y="342" width="24" height="66" rx="3.5" ry="3.5" fill="url(#whiteKeyGrad)" stroke="#94a3b8" stroke-width="0.75"/><rect x="152" y="403" width="24" height="5" rx="2" fill="url(#keyBottomShadow)" opacity="0.45"/><rect x="178" y="342" width="24" height="66" rx="3.5" ry="3.5" fill="url(#activeCyanKey)" stroke="#38bdf8" stroke-width="0.75"/><rect x="178" y="403" width="24" height="5" rx="2" fill="url(#keyBottomShadow)" opacity="0.45"/><rect x="204" y="342" width="24" height="66" rx="3.5" ry="3.5" fill="url(#whiteKeyGrad)" stroke="#94a3b8" stroke-width="0.75"/><rect x="204" y="403" width="24" height="5" rx="2" fill="url(#keyBottomShadow)" opacity="0.45"/><rect x="230" y="342" width="24" height="66" rx="3.5" ry="3.5" fill="url(#whiteKeyGrad)" stroke="#94a3b8" stroke-width="0.75"/><rect x="230" y="403" width="24" height="5" rx="2" fill="url(#keyBottomShadow)" opacity="0.45"/><rect x="256" y="342" width="24" height="66" rx="3.5" ry="3.5" fill="url(#whiteKeyGrad)" stroke="#94a3b8" stroke-width="0.75"/><rect x="256" y="403" width="24" height="5" rx="2" fill="url(#keyBottomShadow)" opacity="0.45"/><rect x="282" y="342" width="24" height="66" rx="3.5" ry="3.5" fill="url(#whiteKeyGrad)" stroke="#94a3b8" stroke-width="0.75"/><rect x="282" y="403" width="24" height="5" rx="2" fill="url(#keyBottomShadow)" opacity="0.45"/><rect x="308" y="342" width="24" height="66" rx="3.5" ry="3.5" fill="url(#activeBlueKey)" stroke="#60a5fa" stroke-width="0.75"/><rect x="308" y="403" width="24" height="5" rx="2" fill="url(#keyBottomShadow)" opacity="0.45"/><rect x="334" y="342" width="24" height="66" rx="3.5" ry="3.5" fill="url(#whiteKeyGrad)" stroke="#94a3b8" stroke-width="0.75"/><rect x="334" y="403" width="24" height="5" rx="2" fill="url(#keyBottomShadow)" opacity="0.45"/><rect x="360" y="342" width="24" height="66" rx="3.5" ry="3.5" fill="url(#whiteKeyGrad)" stroke="#94a3b8" stroke-width="0.75"/><rect x="360" y="403" width="24" height="5" rx="2" fill="url(#keyBottomShadow)" opacity="0.45"/>

    <!-- Black Keys -->
    <rect x="144" y="342" width="14" height="40" rx="2" ry="2" fill="url(#blackKeyGrad)" stroke="#090d16" stroke-width="1"/><rect x="146" y="343" width="3" height="36" rx="1" fill="#64748b" opacity="0.45"/><rect x="170" y="342" width="14" height="40" rx="2" ry="2" fill="url(#blackKeyGrad)" stroke="#090d16" stroke-width="1"/><rect x="172" y="343" width="3" height="36" rx="1" fill="#64748b" opacity="0.45"/><rect x="222" y="342" width="14" height="40" rx="2" ry="2" fill="url(#blackKeyGrad)" stroke="#090d16" stroke-width="1"/><rect x="224" y="343" width="3" height="36" rx="1" fill="#64748b" opacity="0.45"/><rect x="248" y="342" width="14" height="40" rx="2" ry="2" fill="url(#blackKeyGrad)" stroke="#090d16" stroke-width="1"/><rect x="250" y="343" width="3" height="36" rx="1" fill="#64748b" opacity="0.45"/><rect x="274" y="342" width="14" height="40" rx="2" ry="2" fill="url(#blackKeyGrad)" stroke="#090d16" stroke-width="1"/><rect x="276" y="343" width="3" height="36" rx="1" fill="#64748b" opacity="0.45"/><rect x="326" y="342" width="14" height="40" rx="2" ry="2" fill="url(#blackKeyGrad)" stroke="#090d16" stroke-width="1"/><rect x="328" y="343" width="3" height="36" rx="1" fill="#64748b" opacity="0.45"/><rect x="352" y="342" width="14" height="40" rx="2" ry="2" fill="url(#blackKeyGrad)" stroke="#090d16" stroke-width="1"/><rect x="354" y="343" width="3" height="36" rx="1" fill="#64748b" opacity="0.45"/>

    <!-- Interactive Floor Glow under active keys -->
    <ellipse cx="178" cy="415" rx="15" ry="5" fill="#38bdf8" opacity="0.55"/>
    <ellipse cx="308" cy="415" rx="15" ry="5" fill="#60a5fa" opacity="0.5"/>
  </g>
</svg>